name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 3d-websites-hackathon-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify-macos-process-contracts:
    name: Verify macOS process contracts
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          check-latest: false

      - name: Prove the declared macOS host tools exist
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Darwin"
          command -v lsof
          command -v ps

      - name: Install pinned pnpm
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts pnpm@11.20.0
          test "$(node --version)" = "v24.19.0"
          test "$(pnpm --version)" = "11.20.0"

      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate the workflow's static formatting
        run: pnpm exec prettier --check .github/workflows/ci.yml

      - name: Run macOS process ownership contracts
        run: >-
          pnpm exec vitest run
          tests/unit/bootstrap-host-tools.test.mjs
          tests/integration/owned-child-process.integration.test.mjs
          tests/integration/direct-child-ownership.integration.test.mjs
          tests/integration/verification-lease.integration.test.mjs

      - name: Prove the focused lane leaves the checkout clean
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- .
          test -z "$(git ls-files --others --exclude-standard)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  verify-clean-checkout:
    name: Verify clean checkout
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          check-latest: false

      - name: Provision required host process tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends lsof procps
          command -v lsof
          command -v ps

      - name: Install pinned pnpm
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts pnpm@11.20.0
          test "$(node --version)" = "v24.19.0"
          test "$(pnpm --version)" = "11.20.0"

      - name: Prove checkout starts clean
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Bootstrap locked dependencies and browser
        run: pnpm run bootstrap

      - name: Install Chromium system dependencies
        run: pnpm exec playwright install-deps chromium

      - name: Run the complete verification contract
        run: pnpm run verify-all

      - name: Prove regenerators leave the checkout clean
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- .
          test -z "$(git ls-files --others --exclude-standard)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tier0-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .dev/reports/
            .dev/logs/
            evidence/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
